name: Build macOS + Linux Tauri bundles

# Builds Tauri installers on macOS (arm64 + x64) and Linux (AppImage + deb)
# and uploads them to an existing GitHub Release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to upload assets to'
        required: true
        default: 'v0.8.1'
      target:
        description: 'Which platform to build (all / mac-arm / mac-intel / linux)'
        required: false
        default: 'all'

permissions:
  contents: write

jobs:
  mac-arm:
    if: github.event.inputs.target == 'all' || github.event.inputs.target == 'mac-arm' || github.event.inputs.target == ''
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install npm dependencies
        run: npm ci
      - name: Build Tauri dmg (arm64)
        shell: bash
        run: |
          set -e
          printf '{"bundle":{"targets":["dmg"],"createUpdaterArtifacts":false}}\n' > /tmp/tauri-bundle-config.json
          npx tauri build --config /tmp/tauri-bundle-config.json
        env: { CI: true }
      - name: Upload dmg to Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -e; shopt -s nullglob
          files=(src-tauri/target/release/bundle/dmg/*.dmg)
          [ ${#files[@]} -gt 0 ] || { echo "No dmg found"; exit 1; }
          gh release upload "$TAG" "${files[@]}" --repo "${{ github.repository }}" --clobber

  mac-intel:
    if: github.event.inputs.target == 'all' || github.event.inputs.target == 'mac-intel' || github.event.inputs.target == ''
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install npm dependencies
        run: npm ci
      - name: Build Tauri dmg (x64)
        shell: bash
        run: |
          set -e
          printf '{"bundle":{"targets":["dmg"],"createUpdaterArtifacts":false}}\n' > /tmp/tauri-bundle-config.json
          npx tauri build --config /tmp/tauri-bundle-config.json
        env: { CI: true }
      - name: Upload dmg to Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -e; shopt -s nullglob
          files=(src-tauri/target/release/bundle/dmg/*.dmg)
          [ ${#files[@]} -gt 0 ] || { echo "No dmg found"; exit 1; }
          gh release upload "$TAG" "${files[@]}" --repo "${{ github.repository }}" --clobber

  linux:
    if: github.event.inputs.target == 'all' || github.event.inputs.target == 'linux' || github.event.inputs.target == ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libglib2.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev
      - name: Install npm dependencies
        run: npm ci
      - name: Build Tauri AppImage + deb
        shell: bash
        run: |
          set -e
          printf '{"bundle":{"targets":["appimage","deb"],"createUpdaterArtifacts":false}}\n' > /tmp/tauri-bundle-config.json
          npx tauri build --config /tmp/tauri-bundle-config.json
        env: { CI: true }
      - name: Upload AppImage + deb to Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -e; shopt -s nullglob
          files=(
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          )
          [ ${#files[@]} -gt 0 ] || { echo "No bundles found"; exit 1; }
          gh release upload "$TAG" "${files[@]}" --repo "${{ github.repository }}" --clobber
